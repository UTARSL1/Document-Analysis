<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Digitization System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }
        
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        .stat-value {
            color: #333;
            font-size: 2.5em;
            font-weight: bold;
        }
        
        .stat-value.success {
            color: #10b981;
        }
        
        .stat-value.warning {
            color: #f59e0b;
        }
        
        .stat-value.error {
            color: #ef4444;
        }
        
        .upload-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }
        
        .upload-form {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: end;
        }
        
        .form-group {
            flex: 1;
            min-width: 200px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input[type="file"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1em;
        }
        
        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        button:hover {
            transform: scale(1.05);
        }
        
        .documents-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        
        th {
            background: #f9fafb;
            font-weight: 600;
            color: #333;
        }
        
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .status-ingested { background: #dbeafe; color: #1e40af; }
        .status-qc_passed { background: #d1fae5; color: #065f46; }
        .status-qc_failed { background: #fee2e2; color: #991b1b; }
        .status-ocr_completed { background: #d1fae5; color: #065f46; }
        .status-manual_review { background: #fef3c7; color: #92400e; }
        
        .action-btn {
            padding: 6px 12px;
            font-size: 0.85em;
            margin: 0 5px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 Document Digitization System</h1>
            <p class="subtitle">National-scale automated QC & HTR/OCR processing</p>
        </header>
        
        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="stat-label">Total Documents</div>
                <div class="stat-value" id="total-docs">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">QC Passed</div>
                <div class="stat-value success" id="qc-passed">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Manual Review</div>
                <div class="stat-value warning" id="manual-review">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Auto-Pass Rate</div>
                <div class="stat-value" id="pass-rate">-</div>
            </div>
        </div>
        
        <div class="upload-section">
            <h2 style="margin-bottom: 20px;">Upload Document</h2>
            <form class="upload-form" id="upload-form">
                <div class="form-group">
                    <label for="file">Select File</label>
                    <input type="file" id="file" accept=".pdf,.tiff,.tif,.jpg,.jpeg,.png" required>
                </div>
                <div class="form-group">
                    <label for="doc-type">Document Type</label>
                    <select id="doc-type" required>
                        <option value="">Select type...</option>
                        <option value="birth_certificate">Birth Certificate</option>
                        <option value="id_card_front">ID Card (Front)</option>
                        <option value="passport_bio_page">Passport Bio Page</option>
                        <option value="marriage_certificate">Marriage Certificate</option>
                        <option value="land_title">Land Title</option>
                    </select>
                </div>
                <button type="submit">Upload & Process</button>
            </form>
            <div id="upload-status" style="margin-top: 15px; color: #666;"></div>
        </div>
        
        <div class="documents-section">
            <h2 style="margin-bottom: 20px;">Recent Documents</h2>
            <div id="documents-list" class="loading">Loading documents...</div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8000/api/v1';
        
        // Load stats
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/qc/stats`);
                const data = await response.json();
                
                document.getElementById('total-docs').textContent = data.total_verified;
                document.getElementById('qc-passed').textContent = data.passed;
                document.getElementById('manual-review').textContent = data.manual_review;
                document.getElementById('pass-rate').textContent = data.auto_pass_rate + '%';
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        // Load documents
        async function loadDocuments() {
            try {
                const response = await fetch(`${API_BASE}/documents?page=1&page_size=20`);
                const data = await response.json();
                
                const container = document.getElementById('documents-list');
                
                if (data.items.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #666;">No documents yet. Upload one to get started!</p>';
                    return;
                }
                
                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>Filename</th>
                                <th>Type</th>
                                <th>Status</th>
                                <th>Uploaded</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                data.items.forEach(doc => {
                    const date = new Date(doc.created_at).toLocaleString();
                    html += `
                        <tr>
                            <td>${doc.original_filename}</td>
                            <td>${doc.doc_type}</td>
                            <td><span class="status-badge status-${doc.status}">${doc.status}</span></td>
                            <td>${date}</td>
                            <td>
                                <button class="action-btn" onclick="viewDocument('${doc.id}')">View</button>
                            </td>
                        </tr>
                    `;
                });
                
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (error) {
                console.error('Error loading documents:', error);
                document.getElementById('documents-list').innerHTML = '<p style="color: #ef4444;">Error loading documents</p>';
            }
        }
        
        // Upload document
        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('file');
            const docType = document.getElementById('doc-type').value;
            const statusDiv = document.getElementById('upload-status');
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('doc_type', docType);
            
            statusDiv.textContent = 'Uploading...';
            statusDiv.style.color = '#667eea';
            
            try {
                const response = await fetch(`${API_BASE}/ingestion/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    statusDiv.textContent = '✓ Document uploaded successfully! Processing started...';
                    statusDiv.style.color = '#10b981';
                    fileInput.value = '';
                    
                    // Reload data
                    setTimeout(() => {
                        loadStats();
                        loadDocuments();
                    }, 1000);
                } else {
                    statusDiv.textContent = '✗ Upload failed';
                    statusDiv.style.color = '#ef4444';
                }
            } catch (error) {
                statusDiv.textContent = '✗ Upload error: ' + error.message;
                statusDiv.style.color = '#ef4444';
            }
        });
        
        // View document details
        function viewDocument(id) {
            window.open(`${API_BASE}/documents/${id}`, '_blank');
        }
        
        // Initial load
        loadStats();
        loadDocuments();
        
        // Auto-refresh every 10 seconds
        setInterval(() => {
            loadStats();
            loadDocuments();
        }, 10000);
    </script>
</body>
</html>
