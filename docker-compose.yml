version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: documents
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: .
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/documents
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      ARTIFACT_DIR: /data/artifacts
      DOC_TYPES_PATH: /app/config/doc_types.json
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"

  worker:
    build: .
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/documents
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      ARTIFACT_DIR: /data/artifacts
    volumes:
      - ./data:/data

volumes:
  postgres_data:
